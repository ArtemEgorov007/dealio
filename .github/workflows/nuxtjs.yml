# Build and deploy the Nuxt SPA to the ERP hosting environments.
name: Build and deploy ERP static site

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда развернуть сборку'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        run: echo "environment=${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.resolve-target.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_ERP_GAS_URL: ${{ secrets.NUXT_PUBLIC_ERP_GAS_URL || secrets.NUXT_PUBLIC_CRM_GAS_URL }}
          NUXT_PUBLIC_WAREHOUSE_GAS_URL: ${{ secrets.NUXT_PUBLIC_WAREHOUSE_GAS_URL }}
        run: npm run generate

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test "$(find .output/public -type l | wc -l)" -eq 0
          du -sh .output/public

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-static-site
          path: ./.output/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [resolve-target, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: erp-deploy-${{ needs.resolve-target.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve-target.outputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: erp-static-site
          path: ./site

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure trusted SFTP host
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload static site without remote deletion
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_SERVER_DIR: ${{ vars.SFTP_SERVER_DIR }}
        run: |
          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e scp -pr \
            -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ./site/. "$SFTP_USERNAME@$SFTP_HOST:$SFTP_SERVER_DIR"
