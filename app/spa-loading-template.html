<!doctype html>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #EAF2FD;
  }
  .spa-loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #EAF2FD;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  }
  .spa-loader__mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #016ED7 0%, #3897ED 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(1, 110, 215, 0.45);
  }
  .spa-loader__mark svg {
    width: 30px;
    height: 30px;
  }
  .spa-loader__title {
    font-size: 20px;
    font-weight: 800;
    color: #0B1B2B;
    letter-spacing: -0.2px;
  }
  .spa-loader__spinner {
    position: relative;
    width: 26px;
    height: 26px;
  }
  .spa-loader__spinner::before,
  .spa-loader__spinner::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .spa-loader__spinner::before {
    border: 2.5px solid rgba(1, 110, 215, 0.18);
  }
  .spa-loader__spinner::after {
    border: 2.5px solid transparent;
    border-top-color: #016ED7;
    animation: spa-loader-spin 0.75s linear infinite;
  }
  @keyframes spa-loader-spin {
    to { transform: rotate(360deg); }
  }
</style>
<div class="spa-loader">
  <div class="spa-loader__mark">

    </svg>
  </div>
  <div class="spa-loader__title">Морфлот Технология</div>
  <div class="spa-loader__spinner"></div>
</div>
